services:
  db:
    image: mysql:8.0
    container_name: online-auction-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auctiondb
      MYSQL_USER: auctionuser
      MYSQL_PASSWORD: auctionpass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uauctionuser", "-pauctionpass"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Uncomment to expose MySQL to host if needed:
    # ports:
    #   - "3307:3306"

  backend:
    build: ./spring/auction
    container_name: online-auction-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/auctiondb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8082:8081"   # host:container (so you can access it on localhost:8082)
    restart: unless-stopped


  frontend:
    build: ./react/online-bidding-frontend  # Corrected the path to match the actual directory structure
    container_name: online-auction-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
    # If your nginx.conf proxies /api to the backend, it will reach service name "backend" on port 8081

volumes:
  mysql_data: {}

